services:
  csr:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: csr-service:local
    ports:
      - "${CSR_PORT:-9020}:9020"
    env_file:
      - path: .env
        required: false
    environment:
      CSR_OLLAMA_BASE_URL: ${CSR_OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  core:
    build:
      context: .
      dockerfile: docker/Dockerfile.core
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: devkit-core:local
    working_dir: /workspace
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    stdin_open: true
    tty: true
    volumes:
      - models:/models
      - hf-cache:/home/dev/.cache/huggingface
      - torch-cache:/home/dev/.cache/torch
      - uv-cache:/home/dev/.cache/uv
      - .:/workspace:cached
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HOME=/home/dev
      - HF_HOME=/home/dev/.cache/huggingface
      - TRANSFORMERS_CACHE=/home/dev/.cache/huggingface
      - TORCH_HOME=/home/dev/.cache/torch
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    user: "${UID:-1000}:${GID:-1000}"
    command: ["bash", "-l"]
    profiles:
      - dev

volumes:
  models:
  hf-cache:
  torch-cache:
  uv-cache:
